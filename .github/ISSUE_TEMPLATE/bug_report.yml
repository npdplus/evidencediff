name: Bug report
description: Report a reproducible EvidenceDiff defect
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal synthetic inputs and exact steps. Do not include secrets or private model output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, pnpm version
