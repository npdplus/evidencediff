name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency and license policy
        run: pnpm check:dependency-policy

      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level=moderate

      - name: Verify runtime/offline boundary
        run: pnpm check:runtime-boundaries

      - name: Scan repository history for secrets
        run: pnpm check:secret-history

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify package boundaries
        run: pnpm check:boundaries

      - name: Build
        run: pnpm build

      - name: CLI smoke
        run: pnpm test:cli-smoke

      - name: P08 example smoke
        run: pnpm test:examples

      - name: Package contents smoke
        run: pnpm test:package

  windows-smoke:
    name: Windows smoke (Node 24)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke
        run: pnpm test:cli-smoke

      - name: P08 example smoke
        run: pnpm test:examples

      - name: Package contents smoke
        run: pnpm test:package
